name: Deploy site to GitHub Pages

# The site lives in public/, which Pages can't serve directly — Pages only serves the
# repo root, /docs, or a branch. This workflow uploads public/ as the Pages artifact
# instead, so the source layout stays as-is and the Cloudflare deploy (wrangler.jsonc,
# which also points at ./public) keeps working unchanged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a publish midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
